<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Gravity Logo Assembly</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="video-container">
        <!-- White Background -->
        <div class="white-bg"></div>
        
        <!-- Canvas for Particles/Shatter -->
        <canvas id="particle-canvas"></canvas>

        <div class="content">
            <div class="logo-assembly">
                <!-- Slices of the logo (Black on White) -->
                <div class="slice stars"><img src="logo.png"></div>
                <div class="slice typography"><img src="logo.png"></div>
                <div class="slice hat"><img src="logo.png"></div>
                <div class="slice flourishes-left"><img src="logo.png"></div>
                <div class="slice flourishes-right"><img src="logo.png"></div>
                <div class="slice banner"><img src="logo.png"></div>
                
                <!-- Full logo for hover hold -->
                <div class="logo-full"><img src="logo.png"></div>
            </div>
        </div>

        <div class="ui">
            <button id="play-btn">START ASSEMBLY</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
